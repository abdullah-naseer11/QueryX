name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: shop
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d shop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SKIP_DOCKER_TESTS: "1"   # the Docker sandbox tests run on your own computer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: cp .env.example .env
      - run: python -m scripts.seed
      - run: python -m scripts.setup_readonly
      - run: pytest -q
